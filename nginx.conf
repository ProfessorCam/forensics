server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the raw capture with the right type so browsers offer to save it
    # (and Wireshark opens it) instead of rendering binary junk.
    location /pcaps/ {
        types { application/vnd.tcpdump.pcap pcap; }
        default_type application/vnd.tcpdump.pcap;
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control 'no-cache' always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
